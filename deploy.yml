# Deploys the repository root as a static site, bypassing Jekyll entirely.
#
# Why this exists: the default "pages-build-deployment" workflow runs the repo
# through Jekyll before publishing. This project is a single hand-built
# index.html produced by bank_dashboard.py -- there is no _config.yml, no
# _layouts, no front matter -- so the Jekyll build step fails and the deploy
# job never runs, leaving the previously published page live.
#
# Setup: in the repo, go to Settings -> Pages -> "Build and deployment" and set
# Source to "GitHub Actions" (not "Deploy from a branch"). That switches Pages
# off the legacy Jekyll pipeline and onto this workflow.
#
# Action versions below are current (checkout v4, configure-pages v5,
# upload-pages-artifact v3, deploy-pages v4), which also clears the
# "Node.js 20 is deprecated" warning from the legacy pipeline.

name: Deploy static site to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:      # lets you re-deploy by hand without a new commit

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; don't cancel a run that is mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Publish the repo root. index.html sits here alongside .nojekyll.
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
